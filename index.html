<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games for Nerds</title>
<style>
  :root {
    --paper: #fdf6ec;
    --ink: #1a1a2e;
    --pink: #f94c8d;
    --teal: #2ec4b6;
    --yellow: #ffd93d;
    --green: #8ac926;
    --blue: #3a86ff;
    --purple: #9b5de5;
    --orange: #ff8811;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--paper);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260"><g fill="none" stroke-width="3" opacity="0.22"><circle cx="42" cy="38" r="11" stroke="%23f94c8d"/><path d="M158 26 l13 22 h-26 z" stroke="%232ec4b6"/><path d="M28 176 q10 -15 20 0 t20 0" stroke="%239b5de5"/><path d="M196 152 h18 m-9 -9 v18" stroke="%23ff8811"/><circle cx="124" cy="112" r="5" fill="%23ffd93d" stroke="none"/><circle cx="222" cy="218" r="5" fill="%232ec4b6" stroke="none"/><path d="M70 230 l10 -16 l10 16" stroke="%23ffd93d"/></g></svg>');
    color: var(--ink);
    font-family: 'Trebuchet MS', 'Century Gothic', Futura, Verdana, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 {
    font-size: 3rem; letter-spacing: 0.03em; display: inline-block;
    transform: rotate(-2deg); text-shadow: 5px 5px 0 var(--pink);
  }
  .tagline { font-weight: bold; color: var(--purple); letter-spacing: 0.08em; margin-top: 6px; }

  .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
  .game-card {
    display: block; text-decoration: none; color: var(--ink);
    background: #fff; width: 260px;
    border: 3px solid var(--ink); border-radius: 18px;
    padding: 26px 22px; text-align: center;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .game-card.bingpot { box-shadow: 8px 8px 0 var(--teal); }
  .game-card.connections { box-shadow: 8px 8px 0 var(--purple); }
  .game-card:hover { transform: translate(-2px, -2px); }
  .game-card.bingpot:hover { box-shadow: 10px 10px 0 var(--teal); }
  .game-card.connections:hover { box-shadow: 10px 10px 0 var(--purple); }
  .game-card:active { transform: translate(8px, 8px); box-shadow: none !important; }

  .emblem {
    width: 110px; height: 110px; margin: 0 auto 16px;
    display: grid; place-items: center;
  }
  .emblem.wheel {
    border-radius: 50%; border: 3px solid var(--ink);
    background: conic-gradient(var(--yellow) 0 25%, var(--pink) 0 50%, var(--teal) 0 75%, var(--purple) 0);
    position: relative;
  }
  .emblem.wheel::after {
    content: '?'; position: absolute; width: 44px; height: 44px;
    background: #fff; border: 3px solid var(--ink); border-radius: 50%;
    display: grid; place-items: center; font-weight: bold; font-size: 1.4rem;
  }
  .emblem.squares { display: grid; grid-template-columns: repeat(2, 48px); grid-template-rows: repeat(2, 48px); gap: 6px; }
  .emblem.squares span { border: 3px solid var(--ink); border-radius: 8px; }
  .emblem.squares .y { background: var(--yellow); }
  .emblem.squares .g { background: var(--green); }
  .emblem.squares .b { background: var(--blue); }
  .emblem.squares .p { background: var(--purple); }

  .game-card h2 { font-size: 1.5rem; margin-bottom: 6px; }
  .game-card p { font-size: 0.92rem; line-height: 1.35; color: #444; }
  footer { margin-top: 34px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>

<header>
  <h1>Games for Nerds</h1>
  <div class="tagline">PICK YOUR DAILY NUMBER FIX</div>
</header>

<div class="cards">
  <a class="game-card bingpot" href="bingpot.html">
    <div class="emblem wheel"></div>
    <h2>Bingpot!</h2>
    <p>Use every number on the wheel to hit a target. Rounds climb from five numbers to nine.</p>
  </a>
  <a class="game-card connections" href="connections.html">
    <div class="emblem squares">
      <span class="y"></span><span class="g"></span><span class="b"></span><span class="p"></span>
    </div>
    <h2>Number Connections</h2>
    <p>Sort sixteen numbers into four hidden groups. Mind the traps — a number can fit more than one.</p>
  </a>
</div>

<footer>two games · one habit</footer>

</body>
</html>
