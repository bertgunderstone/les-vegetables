<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Detective IDE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
    <style>
        /* LAYOUT & BASICS */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* SIDEBAR (Schema) */
        .sidebar { width: 250px; background: #2b2d30; color: #a9b7c6; display: flex; flex-direction: column; border-right: 1px solid #1e1f22; flex-shrink: 0; }
        .sidebar-header { padding: 15px; background: #3c3f41; font-weight: bold; color: #fff; border-bottom: 1px solid #1e1f22; }
        .schema-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .schema-table { padding: 0; }
        .table-name { padding: 8px 15px; cursor: pointer; font-weight: 600; display: block; user-select: none; }
        .table-name:hover { background: #3c3f41; color: #fff; }
        .table-name::before { content: "📄 "; font-size: 0.8em; }
        .column-list { list-style: none; padding-left: 30px; display: none; background: #313335; }
        .column-list.open { display: block; }
        .column-item { padding: 4px 0; font-size: 0.9em; color: #808080; }
        .column-type { float: right; margin-right: 10px; font-size: 0.8em; color: #6a8759; }

        /* MAIN AREA */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: #1e1f22; }
        
        /* EDITOR SECTION */
        .editor-container { height: 40%; display: flex; flex-direction: column; border-bottom: 1px solid #3c3f41; }
        .toolbar { background: #3c3f41; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; }
        .toolbar h2 { margin: 0; font-size: 1rem; color: #fff; }
        textarea { flex-grow: 1; background: #2b2d30; color: #a9b7c6; border: none; padding: 15px; font-family: "JetBrains Mono", "Courier New", monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
        
        /* BUTTONS */
        .btn-run { background: #365880; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-run:hover { background: #4b6e96; }
        .shortcut-hint { font-size: 0.8em; color: #808080; margin-left: 10px; }

        /* RESULTS SECTION (Tabs) */
        .results-container { height: 60%; display: flex; flex-direction: column; background: #2b2d30; }
        .tabs-header { display: flex; background: #3c3f41; overflow-x: auto; border-bottom: 1px solid #1e1f22; }
        .tab { padding: 8px 15px; color: #a9b7c6; cursor: pointer; border-right: 1px solid #1e1f22; display: flex; align-items: center; font-size: 0.9rem; min-width: 100px; }
        .tab.active { background: #2b2d30; color: #fff; border-top: 2px solid #365880; }
        .tab:hover { background: #45494a; }
        .close-tab { margin-left: 10px; border-radius: 50%; padding: 0 4px; font-size: 0.8em; }
        .close-tab:hover { background: #cc0000; color: white; }
        
        /* RESULT CONTENT */
        .tab-content { flex-grow: 1; overflow: auto; padding: 15px; display: none; }
        .tab-content.active { display: block; }
        
        /* TABLES */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; color: #a9b7c6; }
        th, td { border: 1px solid #3c3f41; padding: 8px; text-align: left; }
        th { background-color: #3c3f41; color: #fff; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #313335; }
        .error-msg { color: #ff6b68; font-family: monospace; }
        .success-msg { color: #6a8759; font-family: monospace; }
        
        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #2b2d30; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Database Schema</div>
        <ul class="schema-list" id="schemaList">
            </ul>
    </div>

    <div class="main-content">
        
        <div class="editor-container">
            <div class="toolbar">
                <div style="display:flex; align-items:center;">
                    <h2>Console.sql</h2>
                    <span class="shortcut-hint">(Cmd/Ctrl + Enter to Run)</span>
                </div>
                <button class="btn-run" onclick="runQuery()">▶ Run</button>
            </div>
            <textarea id="sqlCommand" placeholder="Write your queries here...">-- Case #002: The Midnight Git Push
-- Select a query and hit Cmd+Enter to run it.

SELECT * FROM employees;

SELECT * FROM door_logs;

SELECT * FROM slack_messages;</textarea>
        </div>

        <div class="results-container">
            <div class="tabs-header" id="tabsHeader"></div>
            <div id="tabsContent"></div>
        </div>
    </div>

<script>
    let db;
    let tabCount = 0;

    // 1. INITIALIZE DATABASE
    config = { locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${filename}` }
    initSqlJs(config).then(function(SQL){
        db = new SQL.Database();
        
        // --- SEED DATA ---
        db.run("CREATE TABLE employees (id INTEGER, name TEXT, department TEXT, role TEXT);");
        db.run("INSERT INTO employees VALUES (1, 'Alice Founder', 'Exec', 'CEO');");
        db.run("INSERT INTO employees VALUES (2, 'Bob Engineer', 'Engineering', 'Senior Dev');");
        db.run("INSERT INTO employees VALUES (3, 'Charlie Design', 'Design', 'Artist');");
        db.run("INSERT INTO employees VALUES (4, 'Devin Ops', 'IT', 'Sysadmin');");

        db.run("CREATE TABLE door_logs (log_id INTEGER, employee_id INTEGER, time TEXT, access_type TEXT);");
        db.run("INSERT INTO door_logs VALUES (101, 1, '2023-10-25 18:00', 'swipe_out');");
        db.run("INSERT INTO door_logs VALUES (102, 2, '2023-10-25 19:00', 'swipe_out');");
        db.run("INSERT INTO door_logs VALUES (103, 1, '2023-10-25 22:00', 'swipe_in');");
        db.run("INSERT INTO door_logs VALUES (104, 4, '2023-10-25 22:15', 'swipe_in');");
        db.run("INSERT INTO door_logs VALUES (105, 4, '2023-10-25 23:00', 'swipe_out');");

        db.run("CREATE TABLE slack_messages (msg_id INTEGER, sender_id INTEGER, receiver_id INTEGER, message TEXT, time TEXT);");
        db.run("INSERT INTO slack_messages VALUES (501, 2, 4, 'I am heading home, servers are acting up though.', '2023-10-25 18:55');");
        db.run("INSERT INTO slack_messages VALUES (502, 1, 4, 'I need you to come in late. I forgot my keycard inside.', '2023-10-25 21:50');");
        db.run("INSERT INTO slack_messages VALUES (503, 4, 1, 'On my way. I will let you in.', '2023-10-25 21:55');");

        console.log("Database initialized.");
        generateSchemaSidebar(); // Auto-build the sidebar
    });

    // 2. RUN QUERY LOGIC
    function runQuery() {
        const textarea = document.getElementById('sqlCommand');
        // Get highlighted text, OR if empty, get all text
        let command = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
        if (!command.trim()) {
            command = textarea.value;
        }

        if (!command.trim()) return; // Don't run empty strings

        tabCount++;
        const tabId = `tab-${tabCount}`;
        const shortCmd = command.length > 15 ? command.substring(0, 15) + "..." : command;

        try {
            const results = db.exec(command);
            createTab(tabId, shortCmd, results, null);
        } catch (err) {
            createTab(tabId, "Error", [], err.message);
        }
    }

    // 3. TAB SYSTEM
    function createTab(id, title, data, error) {
        // Deactivate old tabs
        document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));

        // Create Tab Button
        const tabBtn = document.createElement('div');
        tabBtn.className = 'tab active';
        tabBtn.innerHTML = `${title} <span class="close-tab" onclick="closeTab(event, '${id}')">×</span>`;
        tabBtn.onclick = () => switchTab(id);
        document.getElementById('tabsHeader').appendChild(tabBtn);

        // Create Tab Content
        const contentDiv = document.createElement('div');
        contentDiv.id = id;
        contentDiv.className = 'tab-content active';
        
        if (error) {
            contentDiv.innerHTML = `<div class="error-msg">❌ ${error}</div>`;
        } else if (data.length === 0) {
            contentDiv.innerHTML = `<div class="success-msg">✅ Query executed successfully. No results returned.</div>`;
        } else {
            // Render Table
            const table = document.createElement('table');
            const headerRow = document.createElement('tr');
            data[0].columns.forEach(col => {
                const th = document.createElement('th');
                th.innerText = col;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);
            data[0].values.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(val => {
                    const td = document.createElement('td');
                    td.innerText = val;
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            contentDiv.appendChild(table);
        }
        document.getElementById('tabsContent').appendChild(contentDiv);
        
        // Auto-scroll to new tab
        tabBtn.scrollIntoView();
    }

    function switchTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        // Find the button with the right onclick and set active
        // (A bit hacky but works for vibe coding)
        const tabs = document.getElementById('tabsHeader').children;
        for (let tab of tabs) {
            if (tab.innerHTML.includes(`'${id}'`)) tab.classList.add('active');
        }
        document.getElementById(id).classList.add('active');
    }

    function closeTab(e, id) {
        e.stopPropagation(); // Don't trigger the switchTab event
        const content = document.getElementById(id);
        const header = e.target.parentElement;
        
        // If closing active tab, try to switch to previous
        if (header.classList.contains('active')) {
            const prev = header.previousElementSibling;
            if (prev) prev.click();
        }
        
        header.remove();
        content.remove();
    }

    // 4. DYNAMIC SCHEMA SIDEBAR
    function generateSchemaSidebar() {
        const schemaList = document.getElementById('schemaList');
        // Get all tables
        const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'");
        
        if (tables.length > 0) {
            tables[0].values.forEach(row => {
                const tableName = row[0];
                const li = document.createElement('li');
                li.className = 'schema-table';
                
                // Get columns for this table
                const cols = db.exec(`PRAGMA table_info(${tableName})`);
                let colHtml = '<ul class="column-list">';
                cols[0].values.forEach(col => {
                    colHtml += `<li class="column-item">${col[1]} <span class="column-type">${col[2]}</span></li>`;
                });
                colHtml += '</ul>';

                li.innerHTML = `<span class="table-name" onclick="toggleCols(this)">${tableName}</span>${colHtml}`;
                schemaList.appendChild(li);
            });
        }
    }

    function toggleCols(el) {
        const colList = el.nextElementSibling;
        colList.classList.toggle('open');
    }

    // 5. KEYBOARD SHORTCUT (Cmd+Enter)
    document.getElementById('sqlCommand').addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            e.preventDefault();
            runQuery();
        }
    });

</script>

</body>
</html>
